<!-- Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
    // Initialize Supabase
    const SUPABASE_URL = "https://blxdhohzqobouvieirma.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2M3_O9Pr1V4cOtXKKrh73g_N5Eckx2F";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    // Load the Pristine Plates leaderboard
    async function loadPristinePlates() {
        const container = document.getElementById("pristinePlates");

        try {
            // Get approved lunches
            const { data: lunches, error: lunchError } =
                await supabaseClient
                    .from("lunch_submissions")
                    .select("id, lunch_type, rating, description, image_path, created_at")
                    .eq("status", "approved");

            if (lunchError) throw lunchError;

            if (!lunches || lunches.length === 0) {
                container.textContent = "No approved lunches yet!";
                return;
            }

            // Get likes
            const { data: likes, error: likesError } =
                await supabaseClient
                    .from("lunch_likes")
                    .select("submission_id");

            if (likesError) throw likesError;

            // Count likes
            const likeCounts = {};

            (likes || []).forEach(like => {
                likeCounts[like.submission_id] =
                    (likeCounts[like.submission_id] || 0) + 1;
            });

            // Rank lunches by likes
            const rankedLunches = lunches
                .map(lunch => ({
                    ...lunch,
                    likes: likeCounts[lunch.id] || 0
                }))
                .sort((a, b) =>
                    b.likes - a.likes ||
                    new Date(b.created_at) - new Date(a.created_at)
                )
                .slice(0, 3);

            container.replaceChildren();

            // Display top three
            rankedLunches.forEach((lunch, index) => {
                const imageData = supabaseClient
                    .storage
                    .from("lunch-photos")
                    .getPublicUrl(lunch.image_path);

                const card = document.createElement("article");
                card.className = "pristine-card";

                const img = document.createElement("img");
                img.src = imageData.data.publicUrl;
                img.alt = "Community lunch submission";
                img.loading = "lazy";

                const content = document.createElement("div");
                content.className = "pristine-card-content";

                const rank = document.createElement("div");
                rank.className = "pristine-rank";
                rank.textContent = [
                    "🥇 1st Place",
                    "🥈 2nd Place",
                    "🥉 3rd Place"
                ][index];

                const title = document.createElement("h3");
                title.textContent = lunch.lunch_type;

                const rating = document.createElement("div");
                rating.className = "lunch-rating";
                rating.textContent =
                    "★".repeat(lunch.rating) +
                    "☆".repeat(5 - lunch.rating);

                const description = document.createElement("p");
                description.textContent = lunch.description || "";

                const likesText = document.createElement("p");
                likesText.className = "pristine-likes";
                likesText.textContent = "❤️ " + lunch.likes + " Likes";

                content.append(
                    rank,
                    title,
                    rating,
                    description,
                    likesText
                );

                card.append(img, content);
                container.appendChild(card);
            });

        } catch (error) {
            console.error("Pristine Plates error:", error);
            container.textContent = "Unable to load the leaderboard.";
        }
    }

    loadPristinePlates();
</script>
