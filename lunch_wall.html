<!-- Load the Supabase library FIRST -->

        <script>
            
            // Give each browser a unique visitor ID
let visitorId = localStorage.getItem("lunchVisitorId");

if (!visitorId) {
    visitorId = crypto.randomUUID();
    localStorage.setItem("lunchVisitorId", visitorId);
}
                

async function loadLunchWall() {
    const wall = document.getElementById("lunchWall");
    const message = document.getElementById("wallMessage");

    wall.textContent = "Loading lunches...";

    try {
        // 1. Get approved lunch submissions
        const { data, error } = await supabaseClient
            .from("lunch_submissions")
            .select("id, lunch_type, rating, description, image_path, created_at")
            .eq("status", "approved")
            .order("created_at", { ascending: false })
            .limit(12);

        if (error) throw error;

        wall.replaceChildren();

        if (!data || data.length === 0) {
            wall.textContent = "No approved lunches yet. Be the first!";
            return;
        }

        // 2. Get IDs for the displayed lunches
        const lunchIds = data.map(lunch => lunch.id);

        // 3. Retrieve existing likes
        const { data: likes, error: likesError } = await supabaseClient
            .from("lunch_likes")
            .select("submission_id, visitor_id")
            .in("submission_id", lunchIds);

        if (likesError) throw likesError;

        // 4. Count likes for each lunch
        const likeCounts = {};

        (likes || []).forEach(like => {
            likeCounts[like.submission_id] =
                (likeCounts[like.submission_id] || 0) + 1;
        });

        // 5. Find lunches this visitor has already liked
        const likedLunches = new Set(
            (likes || [])
                .filter(like => like.visitor_id === visitorId)
                .map(like => like.submission_id)
        );

        // 6. Create each lunch card
        data.forEach(lunch => {

            const { data: imageData } = supabaseClient
                .storage
                .from("lunch-photos")
                .getPublicUrl(lunch.image_path);

            const card = document.createElement("article");
            card.className = "lunch-card";

            const img = document.createElement("img");
            img.src = imageData.publicUrl;
            img.alt = "Lunch submitted by a visitor";
            img.loading = "lazy";

            const content = document.createElement("div");
            content.className = "lunch-card-content";

            const title = document.createElement("h4");
            title.textContent = lunch.lunch_type;

            const rating = document.createElement("div");
            rating.className = "lunch-rating";
            rating.textContent =
                "★".repeat(lunch.rating) +
                "☆".repeat(5 - lunch.rating);

            const description = document.createElement("p");
            description.textContent = lunch.description || "";

            const date = document.createElement("p");
            date.className = "lunch-date";
            date.textContent = new Date(
                lunch.created_at
            ).toLocaleDateString();

            // 7. Create the like button
            const likeButton = document.createElement("button");
            likeButton.className = "like-button";

            let liked = likedLunches.has(lunch.id);
            let likeCount = likeCounts[lunch.id] || 0;

            function updateLikeButton() {
                likeButton.textContent =
                    (liked ? "❤️" : "🤍") + " " + likeCount + " Likes";

                likeButton.classList.toggle("liked", liked);
            }

            updateLikeButton();

            // 8. Like and unlike functionality
            likeButton.addEventListener("click", async () => {
                likeButton.disabled = true;

                try {
                    if (liked) {
                        const { error } = await supabaseClient
                            .from("lunch_likes")
                            .delete()
                            .eq("submission_id", lunch.id)
                            .eq("visitor_id", visitorId);

                        if (error) throw error;

                        liked = false;
                        likeCount--;
                    } else {
                        const { error } = await supabaseClient
                            .from("lunch_likes")
                            .insert({
                                submission_id: lunch.id,
                                visitor_id: visitorId
                            });

                        if (error) throw error;

                        liked = true;
                        likeCount++;
                    }

                    updateLikeButton();

                } catch (error) {
                    console.error("Like error:", error);
                    alert("Unable to update your like. Please try again.");
                } finally {
                    likeButton.disabled = false;
                }
            });

            // 9. Add everything to the card
            content.append(title, rating, description, date, likeButton);
            card.append(img, content);
            wall.appendChild(card);
        });

    } catch (error) {
        console.error("Lunch wall error:", error);
        wall.textContent = "Unable to load lunches right now.";
    }
}

loadLunchWall();

        </script>
        
    <script>
    const authClient = window.supabase.createClient(
        "https://blxdhohzqobouvieirma.supabase.co",
        "sb_publishable_2M3_O9Pr1V4cOtXKKrh73g_N5Eckx2F"
    );

    async function updateLoginNavigation() {
        const { data: { session } } =
            await authClient.auth.getSession();

        document.getElementById("loginNav").style.display =
            session ? "none" : "";

        document.getElementById("logoutNav").style.display =
            session ? "" : "none";
    }

    document.getElementById("logoutButton").addEventListener("click", async function (event) {
        event.preventDefault();

        const { error } = await authClient.auth.signOut();

        if (error) {
            alert(error.message);
            return;
        }

        window.location.reload();
    });

    updateLoginNavigation();

    authClient.auth.onAuthStateChange(() => {
        updateLoginNavigation();
    });
</script>
