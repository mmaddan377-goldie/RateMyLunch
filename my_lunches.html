<section class="my-lunches-container">
    <h1 class="center-heading">My Lunches</h1>
    <p id="pageMessage">Loading your lunches...</p>
    <div id="myLunches" class="row"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://blxdhohzqobouvieirma.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2M3_O9Pr1V4cOtXKKrh73g_N5Eckx2F";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function loadMyLunches() {
        const container = document.getElementById("myLunches");
        const message = document.getElementById("pageMessage");

        try {
            const { data: { session }, error: sessionError } =
                await supabaseClient.auth.getSession();

            if (sessionError) throw sessionError;

            if (!session) {
                message.textContent = "Please sign in to view your lunches.";
                return;
            }

            const { data, error } = await supabaseClient
                .from("lunch_submissions")
                .select("id, lunch_type, rating, description, image_path, status, created_at")
                .eq("user_id", session.user.id)
                .order("created_at", { ascending: false });

            if (error) throw error;

            container.replaceChildren();

            if (!data || data.length === 0) {
                message.textContent = "You haven't submitted any lunches yet!";
                return;
            }

            message.textContent = "Here are your lunch submissions!";

            data.forEach(lunch => {
                const column = document.createElement("div");
                column.className = "col-md-4";

                const card = document.createElement("article");
                card.className = "my-lunch-card";

                const image = document.createElement("img");
                image.src = supabaseClient.storage
                    .from("lunch-photos")
                    .getPublicUrl(lunch.image_path).data.publicUrl;
                image.alt = "Your submitted lunch";
                image.loading = "lazy";

                const title = document.createElement("h4");
                title.textContent = lunch.lunch_type;

                const rating = document.createElement("p");
                rating.textContent =
                    "★".repeat(lunch.rating) + "☆".repeat(5 - lunch.rating);

                const description = document.createElement("p");
                description.textContent = lunch.description || "";

                const status = document.createElement("span");
                status.className = "lunch-status status-" + lunch.status;
                status.textContent =
                    lunch.status.charAt(0).toUpperCase() + lunch.status.slice(1);

                const date = document.createElement("p");
                date.textContent = new Date(lunch.created_at).toLocaleDateString();

                card.append(image, title, rating, description, status, date);
                column.appendChild(card);
                container.appendChild(column);
            });

        } catch (error) {
            console.error("My Lunches error:", error);
            message.textContent = "Unable to load your lunches: " + error.message;
        }
    }

    loadMyLunches();
</script>
    
    <script>
    
const authClient = window.supabase.createClient(
    "https://blxdhohzqobouvieirma.supabase.co",
    "sb_publishable_2M3_O9Pr1V4cOtXKKrh73g_N5Eckx2F"
);

async function updateLoginNavigation(session) {

    if (typeof session === "undefined") {
        const { data, error } = await authClient.auth.getSession();

        if (error) {
            console.error(error);
            return;
        }

        session = data.session;
    }

    const loggedIn = !!session;

    document.getElementById("loginNav").style.display =
        loggedIn ? "none" : "";

    document.getElementById("profileNav").style.display =
        loggedIn ? "" : "none";

    if (loggedIn) {
        const user = session.user;
        const metadata = user.user_metadata || {};

        document.getElementById("profileName").textContent =
            metadata.full_name || metadata.name || user.email;

        document.getElementById("profilePicture").src =
            metadata.avatar_url ||
            metadata.picture ||
            "img/default-profile.png";
    }
}

document.getElementById("logoutButton").addEventListener("click", async function(event) {
    event.preventDefault();

    const { error } = await authClient.auth.signOut();

    if (error) {
        alert(error.message);
        return;
    }

    window.location.reload();
});

updateLoginNavigation();

authClient.auth.onAuthStateChange((event, session) => {
    updateLoginNavigation(session);
});

</script>
