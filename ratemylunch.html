    <section>
        <h1 class="center-heading"> Share Your Lunch! </h1>

        <form>
            <div class="form-group" style="margin: .5em 1.25em">
                <label for="FormControlSelect1">Lunch Type</label>
                <select class="form-control" id="FormControlSelect1">
                    <option>Homemade</option>
                    <option>Location Review</option>
                </select>
            </div>
            <div class="form-group" style="margin: .5em 1.25em">
                <label for="FormControlSelect1">Rating</label>
                <fieldset class="star-rating">

                    <input type="radio" id="star5" name="rating" value="5" />
                    <label for="star5" title="5 stars">&#9733;</label>

                    <input type="radio" id="star4" name="rating" value="4" />
                    <label for="star4" title="4 stars">&#9733;</label>

                    <input type="radio" id="star3" name="rating" value="3" />
                    <label for="star3" title="3 stars">&#9733;</label>

                    <input type="radio" id="star2" name="rating" value="2" />
                    <label for="star2" title="2 stars">&#9733;</label>

                    <input type="radio" id="star1" name="rating" value="1" />
                    <label for="star1" title="1 star">&#9733;</label>
                </fieldset>
            </div>
        <div class="form-group" style="margin: .5em 1.25em">
        <label for="Message">Description</label>
                <textarea class=form-control id="message" rows="8" style= "width: 350px" placeholder="Tell us! What is that special thing about your lunch!"></textarea>
        </div>
        <div class="form-group" style="width: 80%; margin: .5em 1.25em" action="/upload" method="POST" enctype="multipart/form-data">
            <label for="photo">Choose an image:</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>
        </div>
        <button type="submit" class="btn btn-primary" style="background-color; margin: .5em 2em">Submit</button>
        </form>
    </section>
